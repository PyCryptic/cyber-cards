<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Cards - Hacker Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css" type="text/css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

</head>
<body class="w-screen h-screen flex flex-col relative">

    <!-- Background -->
    <div class="absolute inset-0 bg-gradient-to-b from-gray-900 to-black z-0"></div>
    <div class="cyber-grid"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-black/60 to-black z-0 pointer-events-none"></div>

    <div id="view-menu" class="absolute inset-0 z-50 flex flex-col items-center justify-center backdrop-blur-sm transition-opacity duration-500">
        <div class="bg-gray-900/90 p-12 rounded-2xl border border-cyan-500/50 shadow-[0_0_50px_rgba(0,243,255,0.2)] text-center relative overflow-hidden">
            <h1 class="text-6xl md:text-8xl font-bold mb-4 font-mono text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-500 glow-text-cyan uppercase tracking-tighter">
                Cyber Cards
            </h1>
            <p class="text-gray-400 mb-12 font-mono tracking-widest uppercase text-sm">v2.0.0 - Local PvP Edition</p>
            
            <div class="space-y-6 flex flex-col items-center w-full max-w-xs mx-auto font-mono">
                <button onclick="startGame()" class="btn-cyber w-full py-4 text-xl font-bold text-cyan-400 rounded uppercase tracking-wider">
                    <i class="fas fa-user-friends mr-2"></i> Local PvP (Start)
                </button>
            </div>
        </div>
    </div>

    <div id="view-pass" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/95 backdrop-blur-xl transition-opacity duration-500">
        <div class="text-center">
            <h2 class="text-5xl font-bold font-mono mb-4 uppercase tracking-widest glow-text-red text-red-500">
                <i class="fas fa-lock mb-4 text-6xl"></i><br>
                Terminal Locked
            </h2>
            <p id="pass-desc" class="text-2xl text-cyan-400 mb-10 font-mono uppercase tracking-wider">
                Pass device to Player 2
            </p>
            <button onclick="unlockTerminal()" class="btn-cyber px-10 py-4 font-mono text-cyan-400 rounded uppercase font-bold tracking-wider text-xl">
                <i class="fas fa-unlock mr-2"></i> Unlock Terminal
            </button>
        </div>
    </div>

    <div id="view-gameover" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90 backdrop-blur-md transition-opacity duration-500">
        <div class="text-center">
            <h2 id="gameover-title" class="text-6xl font-bold font-mono mb-6 uppercase tracking-widest text-cyan-400 glow-text-cyan">
                Player 1 Wins!
            </h2>
            <p id="gameover-desc" class="text-xl text-gray-400 mb-10 font-mono">Target system has been permanently compromised.</p>
            <button onclick="returnToMenu()" class="btn-cyber px-8 py-3 font-mono text-cyan-400 rounded uppercase font-bold tracking-wider">
                Reboot System
            </button>
        </div>
    </div>

    <div id="view-game" class="hidden flex-col h-full w-full relative z-10 transition-opacity duration-500">
        
        <!-- Top: Opponent Stats -->
        <header class="bg-gray-900/90 border-b border-red-900/50 p-4 shadow-lg backdrop-blur-md">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 bg-red-950 border border-red-500 rounded-lg flex items-center justify-center text-3xl shadow-[0_0_15px_rgba(255,0,60,0.3)]">
                        <i class="fas fa-user-secret text-red-500"></i>
                    </div>
                    <div>
                        <h2 id="top-name" class="text-xl font-bold font-mono text-red-400 uppercase tracking-widest glow-text-red">Player 2</h2>
                        <div id="top-block-display" class="hidden text-cyan-400 text-sm font-mono mt-1">
                            <i class="fas fa-shield-alt"></i> Firewall: <span id="top-block">0</span>
                        </div>
                    </div>
                </div>
                
                <div class="w-1/2 max-w-md">
                    <div class="flex justify-between text-xs font-mono text-gray-400 mb-1">
                        <span><i class="fas fa-heart text-red-500"></i> Integrity</span>
                        <span id="top-health-text">100 / 100</span>
                    </div>
                    <div class="stat-bar-container h-4 rounded-full w-full">
                        <div id="top-health-bar" class="stat-bar-fill h-full bg-red-600 rounded-full shadow-[0_0_10px_rgba(255,0,60,0.8)]" style="width: 100%;"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Middle: Action Area & Log -->
        <main class="flex-grow flex overflow-hidden">
            <aside class="w-64 bg-gray-900/80 border-r border-gray-800 p-4 flex flex-col backdrop-blur-sm hidden md:flex">
                <h3 class="text-cyan-500 border-b border-cyan-900 pb-2 mb-4 font-mono uppercase tracking-wider text-sm">
                    <i class="fas fa-list"></i> Terminal Log
                </h3>
                <div id="action-log" class="flex-grow overflow-y-auto space-y-2 text-xs font-mono text-gray-400 pb-4">
                    <!-- Log entries injected here -->
                </div>
            </aside>

            <div class="flex-grow relative flex items-center justify-center p-6">
                <div id="turn-indicator" class="absolute top-10 text-2xl font-bold font-mono tracking-[0.5em] uppercase opacity-30 text-cyan-500 transition-colors duration-300">
                    Player 1 Turn
                </div>

                <div id="action-area" class="hidden absolute flex flex-col items-center bg-gray-900/95 p-6 rounded-xl border border-cyan-500 shadow-[0_0_30px_rgba(0,243,255,0.3)] backdrop-blur-md z-40 transform scale-95 transition-transform duration-200">
                    <div id="action-card-details" class="text-center mb-6 max-w-sm"></div>
                    <div class="flex gap-4">
                        <button id="btn-play-card" onclick="playSelectedCard()" class="btn-cyber px-6 py-2 rounded font-mono font-bold text-cyan-400 uppercase">
                            Execute Payload
                        </button>
                        <button onclick="deselectCard()" class="px-6 py-2 rounded font-mono text-gray-500 hover:text-white uppercase transition-colors">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom: Active Player Stats & Hand -->
        <footer class="bg-gray-900/95 border-t border-cyan-900/50 p-4 pb-8 shadow-[0_-5px_20px_rgba(0,0,0,0.8)] backdrop-blur-lg relative z-20">
            <div class="max-w-6xl mx-auto">
                <div class="flex justify-between items-end mb-6">
                    <div class="w-1/3 min-w-[300px] space-y-3">
                        <div class="flex items-center gap-4 mb-2">
                            <h2 id="bottom-name" class="text-xl font-bold font-mono text-cyan-400 uppercase tracking-widest glow-text-cyan">Player 1</h2>
                            <div id="bottom-block-display" class="hidden bg-cyan-950 text-cyan-300 px-2 py-1 rounded text-sm font-mono border border-cyan-700">
                                <i class="fas fa-shield-alt"></i> <span id="bottom-block">0</span>
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between text-xs font-mono text-gray-400 mb-1">
                                <span><i class="fas fa-heart text-green-500"></i> Integrity</span>
                                <span id="bottom-health-text">100 / 100</span>
                            </div>
                            <div class="stat-bar-container h-3 rounded-full w-full">
                                <div id="bottom-health-bar" class="stat-bar-fill h-full bg-green-500 rounded-full shadow-[0_0_10px_rgba(34,197,94,0.8)]" style="width: 100%;"></div>
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between text-xs font-mono text-gray-400 mb-1">
                                <span><i class="fas fa-bolt text-fuchsia-500"></i> Bandwidth</span>
                                <span id="bottom-bw-text">10 / 10</span>
                            </div>
                            <div class="stat-bar-container h-3 rounded-full w-full">
                                <div id="bottom-bw-bar" class="stat-bar-fill h-full bg-fuchsia-500 rounded-full shadow-[0_0_10px_rgba(217,70,239,0.8)]" style="width: 100%;"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-6">
                        <div class="text-right text-gray-500 text-xs font-mono space-y-1 bg-black/40 p-3 rounded border border-gray-800">
                            <p>Deck: <span id="deck-count" class="text-white font-bold">0</span></p>
                            <p>Discard: <span id="discard-count" class="text-white font-bold">0</span></p>
                        </div>
                        <button id="btn-end-turn" onclick="triggerPassTurn()" class="btn-cyber px-8 py-4 rounded font-mono font-bold text-red-400 uppercase tracking-wider border-red-500/50 hover:bg-red-500/20 hover:shadow-[0_0_20px_rgba(255,0,60,0.6)]">
                            End Turn
                        </button>
                    </div>
                </div>

                <div id="player-hand" class="flex justify-center items-end h-64 gap-0 md:gap-2 perspective-[1000px] mt-4">
                    <!-- Cards injected by JS -->
                </div>
            </div>
        </footer>
    </div>

    <script src="assets/js/cards.js"></script>
    <script src="assets/js/game.js"></script>
</body>
</html>
